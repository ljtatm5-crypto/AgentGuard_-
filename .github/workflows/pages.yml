name: Deploy AgentGuard to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-apple/package-lock.json
      - name: Install frontend
        working-directory: frontend-apple
        run: npm ci
      - name: Verify frontend
        working-directory: frontend-apple
        run: |
          npm run lint
          npm run typecheck
          npm run check:mock
          npm run check:trace
      - name: Build static site
        working-directory: frontend-apple
        env:
          VITE_BASE: /AgentGuard_-/
          VITE_USE_MOCK: "true"
        run: |
          npm run build
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend-apple/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
