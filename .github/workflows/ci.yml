name: AgentGuard integration gate

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  merge-path:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Enforce feature -> dev -> main
        shell: bash
        run: |
          if [[ "${{ github.base_ref }}" == "dev" && "${{ github.head_ref }}" != feature/* ]]; then
            echo "Only feature/* branches may merge into dev."
            exit 1
          fi
          if [[ "${{ github.base_ref }}" == "main" && "${{ github.head_ref }}" != "dev" ]]; then
            echo "Only dev may merge into main."
            exit 1
          fi

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend
        working-directory: backend
        run: pip install -e . pytest
      - name: Backend tests
        working-directory: backend
        run: pytest -q

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agentguard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agentguard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      AGENTGUARD_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/agentguard
      AGENTGUARD_DB_AUTO_CREATE: "false"
      AGENTGUARD_ENVIRONMENT: test
      AGENTGUARD_ALLOW_ANONYMOUS_WRITES: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend
        working-directory: backend
        run: pip install -e . pytest
      - name: Run migrations
        working-directory: backend
        run: alembic upgrade head
      - name: Verify persistence across sessions
        working-directory: backend
        run: python scripts/verify_persistence.py
      - name: Backend tests on PostgreSQL
        working-directory: backend
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-apple/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend for API browser gate
        working-directory: backend
        run: pip install -e .
      - name: Install frontend
        working-directory: frontend-apple
        run: npm ci
      - name: Static and mock gates
        working-directory: frontend-apple
        run: |
          npm run lint
          npm run typecheck
          npm run check:mock
          npm run check:trace
          npm run build
      - name: Install browser
        working-directory: frontend-apple
        run: npx playwright install --with-deps chromium
      - name: Mock browser suite
        working-directory: frontend-apple
        run: npm run test:smoke
      - name: Real API contract
        working-directory: frontend-apple
        env:
          VITE_USE_MOCK: "false"
        run: npx playwright test e2e/api.spec.ts
